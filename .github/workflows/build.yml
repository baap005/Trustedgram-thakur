name: Build TrustedGram
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK and NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Check secrets
        run: test -n "$API_ID" -a -n "$API_HASH" || { echo "API_ID or API_HASH secret missing"; exit 1; }
      - name: Rebrand to TrustedGram
        run: |
          set -e
          BV=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i -E "s/(APP_ID\s*=\s*)[0-9]+;/\1${API_ID};/" $BV
          sed -i -E "s/(APP_HASH\s*=\s*)\"[^\"]*\";/\1\"${API_HASH}\";/" $BV
          sed -i -E 's#(<string name="AppName">)[^<]*(</string>)#\1TrustedGram\2#' TMessagesProj/src/main/res/values/strings.xml
          python3 - <<'PY'
          import re, glob, json
          appid = "app.trustedgram.x"
          pat = re.compile(r'''(applicationId\s*=?\s*)(["'])org\.telegram\.messenger([^"']*)(["'])''')
          n = 0
          for f in glob.glob('**/build.gradle', recursive=True) + glob.glob('**/build.gradle.kts', recursive=True):
              s = open(f).read()
              t = pat.sub(lambda m: m.group(1) + m.group(2) + appid + m.group(3) + m.group(4), s)
              if t != s:
                  open(f, 'w').write(t); n += 1; print('patched', f)
          print('gradle files patched:', n)
          for f in glob.glob('**/google-services.json', recursive=True):
              d = json.load(open(f)); extra = []
              for c in d.get('client', []):
                  pn = c['client_info']['android_client_info']['package_name']
                  if pn.startswith('org.telegram.messenger'):
                      c2 = json.loads(json.dumps(c))
                      c2['client_info']['android_client_info']['package_name'] = appid + pn[len('org.telegram.messenger'):]
                      extra.append(c2)
              d['client'] += extra
              json.dump(d, open(f, 'w'), indent=2)
              print('patched', f, [c['client_info']['android_client_info']['package_name'] for c in d['client']])
          PY
          grep -n "APP_ID" $BV
          grep -rn --include=*.gradle -E "applicationId" . | head -30
      - name: List build tasks
        continue-on-error: true
        run: ./gradlew :TMessagesProj_App:tasks --all | grep -i "^assemble" | head -40
      - name: Build APK
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx6g :TMessagesProj_App:assembleAfatDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TrustedGram-apk
          path: "**/build/outputs/apk/**/*.apk"
